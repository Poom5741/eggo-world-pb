<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OAuth2 redirect page - eggo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00C300; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .message { margin: 20px 0; padding: 15px; border-radius: 10px; text-align: left; }
        .message.success { background: #e8f5e9; color: #2e7d32; }
        .message.error { background: #ffebee; color: #c62828; }
        .btn { background: #00C300; color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 25px; cursor: pointer; margin-top: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; text-align: left; font-size: 11px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥚 eggo</h1>
        <div id="loader" class="loader"></div>
        <div id="message" class="message"></div>
        <button id="retryBtn" class="btn" style="display: none;" onclick="window.location.href='/line-login.html'">Try Again</button>
    </div>

    <script type="module">
        import PocketBase from "https://cdn.jsdelivr.net/gh/pocketbase/js-sdk@master/dist/pocketbase.es.mjs"

        const pb = new PocketBase(window.location.origin);
        const redirectURL = window.location.origin + "/line-callback.html";
        const LINE_CLIENT_ID = "2009441873";

        const loaderEl = document.getElementById("loader");
        const messageEl = document.getElementById("message");
        const retryBtn = document.getElementById("retryBtn");

        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const error = params.get("error");
        const errorDescription = params.get("error_description");
        const state = params.get("state");
        
        // Parse state to get return URL (for local development)
        let returnUrl = null;
        if (state) {
            try {
                const stateData = JSON.parse(atob(state));
                returnUrl = stateData.returnUrl;
                console.log("Found return URL in state:", returnUrl);
            } catch (e) {
                console.log("Could not parse state:", e);
            }
        }

        console.log("=== OAuth Callback ===");
        console.log("Code:", code);
        console.log("Return URL:", returnUrl);

        function generatePassword() {
            return Array.from(crypto.getRandomValues(new Uint8Array(16)))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        async function handleCallback() {
            if (error) {
                showError("LINE Error: " + error + (errorDescription ? " - " + errorDescription : ""));
                return;
            }
            
            if (!code) {
                showError("No authorization code received.");
                return;
            }

            try {
                // Exchange auth code for tokens via server-side endpoint (keeps client_secret secure)
                const exchangeResponse = await fetch('/api/auth/line-exchange', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, redirect_uri: redirectURL })
                });

                if (!exchangeResponse.ok) {
                    const errData = await exchangeResponse.json().catch(() => ({}));
                    throw new Error("Token exchange failed: " + (errData?.error?.message || exchangeResponse.statusText));
                }

                const exchangeResult = await exchangeResponse.json();
                if (!exchangeResult.success) {
                    throw new Error("Token exchange error: " + (exchangeResult.error?.message || "unknown error"));
                }

                const data = exchangeResult.data;
                console.log("Got tokens from server, sub:", data.sub ? "yes" : "no");

                const sub = data.sub;
                const name = data.name || 'LINE User';
                const picture = data.picture || '';
                const email = `${sub.slice(0, 8)}@line.eggo`;

                console.log("Looking for user:", { sub, name, email });

                let user;
                let isNewUser = false;
                
                console.log("=== GENERATING PASSWORD ===");
                const password = generatePassword();
                console.log("Generated password length:", password.length);
                
                // Try to find user via backend endpoint first (doesn't require auth)
                console.log("Checking if user exists via backend...");
                try {
                    const userRes = await fetch(window.location.origin + '/api/auth/line-user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email })
                    });
                    
                    if (userRes.ok) {
                        const userData = await userRes.json();
                        user = userData.user;
                        console.log("Found existing user via backend:", user.id, "wallet:", user.wallet_address);
                    } else {
                        console.log("User not found, will create new user");
                        isNewUser = true;
                    }
                } catch (backendErr) {
                    console.log("Backend lookup failed, will try to create user");
                    isNewUser = true;
                }
                
                // Only create user if they don't exist
                if (isNewUser) {
                    console.log("=== CREATING NEW USER ===");
                    console.log("User data:", { name, email, sub: `line_${sub}` });
                    try {
                        user = await pb.collection('users').create({
                            name: name,
                            email: email,
                            emailVisibility: false,
                            username: `line_${sub}`,
                            externalId: `line_${sub}`,
                            password: password,
                            passwordConfirm: password
                        });
                        console.log("✓ User created successfully:", user.id);
                        console.log("User wallet field:", user.wallet || "NOT SET");
                        console.log("User daccPublickey field:", user.daccPublickey || "NOT SET");
                    } catch (createErr) {
                        console.error("✗ User creation FAILED:", createErr);
                        const errData = createErr.data?.data || {};
                        console.log("Create error details:", JSON.stringify(errData, null, 2));
                        
                        if (errData.email?.code === 'validation_not_unique') {
                            console.log("User already exists during creation, fetching existing user...");
                            // User was created between our check and creation attempt, fetch them
                            try {
                                const userRes = await fetch(window.location.origin + '/api/auth/line-user', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ email: email })
                                });
                                
                                if (userRes.ok) {
                                    const userData = await userRes.json();
                                    user = userData.user;
                                    console.log("Fetched existing user:", user.id);
                                } else {
                                    throw new Error("Could not fetch user");
                                }
                            } catch (fetchErr) {
                                console.log("Could not fetch existing user:", fetchErr.message);
                                showError("User exists but could not be fetched. Please try again.");
                                return;
                            }
                        } else {
                            showError("Create failed: " + JSON.stringify(errData));
                            return;
                        }
                    }
                }
                
                // Verify wallet was created by hook
                console.log("=== VERIFY WALLET CREATION ===")
                console.log("User ID:", user.id)
                console.log("User wallet:", user.wallet || "MISSING")
                console.log("User daccPublickey:", user.daccPublickey || "MISSING")
                
                // Wallet creation hook might still be running, retry up to 3 times
                let retries = 0
                const maxRetries = 3
                                
                while ((!user.wallet || !user.daccPublickey) && retries < maxRetries) {
                    console.log(`⌛ Wallet not ready yet, retrying (${retries + 1}/${maxRetries})...`)
                    await new Promise(resolve => setTimeout(resolve, 2000)) // Wait 2 seconds
                                    
                    // Refresh user data via backend endpoint (doesn't require auth)
                    const refreshRes = await fetch(window.location.origin + '/api/auth/line-user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email })
                    })
                                    
                    if (refreshRes.ok) {
                        const refreshData = await refreshRes.json()
                        user = refreshData.user
                        retries++
                                        
                        console.log("Refreshed user - wallet:", user.wallet || "MISSING", "dacc:", user.daccPublickey || "MISSING")
                    } else {
                        console.log("Refresh failed, status:", refreshRes.status)
                        retries++
                    }
                }
                
                if (!user.wallet) {
                    console.error("⚠ WALLET NOT CREATED BY HOOK - This should not happen after Phase 18 fix")
                    console.error("User record:", JSON.stringify(user, null, 2))
                    
                    // Show error to user (wallet is required for Buy Now flow)
                    showError("Wallet creation failed. Please contact support. (Error: WALLET_NOT_CREATED)")
                    return
                }
                
                if (!user.daccPublickey) {
                    console.error("⚠ DACC PUBLIC KEY MISSING")
                    showError("Wallet setup incomplete. Please contact support. (Error: DACC_KEY_MISSING)")
                    return
                }
                
                console.log("✓ Wallet verified:", user.wallet)
                console.log("✓ daccPublickey verified:", user.daccPublickey)
                
                // After user is created/updated, authenticate with PocketBase to get token
                // Call /api/auth/line-auth endpoint which internally calls authWithPassword
                const generatedPassword = password; // Use the same random password from earlier
                
                console.log("Authenticating with PocketBase...");
                const authResponse = await fetch(window.location.origin + '/api/auth/line-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email, 
                        password: generatedPassword 
                    })
                });
                
                if (!authResponse.ok) {
                    console.error("Auth endpoint failed:", authResponse.status);
                    throw new Error("PocketBase auth failed: " + authResponse.statusText);
                }
                
                const authData = await authResponse.json();
                if (!authData.success) {
                    throw new Error("Auth failed: " + (authData.error?.message || "unknown error"));
                }
                
                console.log("✓ Auth successful, token received");
                const pbToken = authData.token;
                const userWithToken = authData.user;
                
                // ถ้ามี returnUrl ใน state ให้ redirect กลับไป frontend ด้วย auth token
                // Frontend จะใช้ token นี้โดยตรง ไม่ต้องเรียก auth-with-oauth2
                if (returnUrl) {
                    console.log("Redirecting back to frontend with auth token:", returnUrl);
                    
                    // ส่ง token และ user data กลับไปให้ frontend (ไม่ใช่ email+password แบบเก่า)
                    const redirectWithToken = `${returnUrl}?token=${encodeURIComponent(pbToken)}&user=${encodeURIComponent(JSON.stringify(userWithToken))}&state=${encodeURIComponent(state || '')}`;
                    window.location.href = redirectWithToken;
                    return;
                }
                            

                localStorage.setItem('pb_auth', JSON.stringify({ token: pbToken, model: userWithToken }));
                
                // ถ้ามี returnUrl ใน state ให้ redirect กลับไป frontend ด้วย auth token (round 2 - after wallet creation)
                if (returnUrl) {
                    console.log("Redirecting back to frontend with auth token (post-wallet):", returnUrl);
                    const redirectWithToken = `${returnUrl}?token=${encodeURIComponent(pbToken)}&user=${encodeURIComponent(JSON.stringify(userWithToken))}&state=${encodeURIComponent(state || '')}`;
                    window.location.href = redirectWithToken;
                    return;
                }
                
                // Fallback: แสดงหน้าสำเร็จ (production without returnUrl)
                loaderEl.style.display = "none";
                messageEl.className = "message success";
                messageEl.innerHTML = `
                    <strong>✓ Login Successful!</strong><br><br>
                    <strong>Name:</strong> ${user.name || 'N/A'}<br>
                    <strong>Email:</strong> ${user.email || 'N/A'}<br>
                    <strong>Wallet:</strong> ${user.wallet ? user.wallet.substring(0, 10) + '...' : 'MISSING'}<br>
                    <br>กรุณากลับไปหน้าแอปพลิเคชันแล้วล็อกอินใหม่
                `;
                
            } catch (err) {
                console.error("Error:", err);
                showError(err.message + (err.data?.data ? " - " + JSON.stringify(err.data.data) : ""));
            }
        }

        function showError(msg) {
            loaderEl.style.display = "none";
            messageEl.className = "message error";
            messageEl.innerHTML = `<strong>Error:</strong> ${msg}`;
            retryBtn.style.display = "inline-block";
        }

        handleCallback();
    </script>
</body>
</html>
