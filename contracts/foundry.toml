[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
test = "test"
script = "script"
allow_paths = ["lib/chainlink-contracts/src/v0.8"]
ignored_warnings_from = [
  "lib/chainlink-contracts/src/v0.8/vrf/test",
  "lib/chainlink-contracts/src/v0.8/vrf/testhelpers",
  "lib/chainlink-contracts/src/v0.8/shared/test",
  "lib/chainlink-contracts/src/v0.8/llo-feeds",
  "lib/chainlink-contracts/src/v0.8/workflow"
]

[rpc_endpoints]
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"
bsc = "https://bsc-dataseed.binance.org"
chain0xl3 = "https://rpc.0xl3.com"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api" }
bsc = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
chain0xl3 = { key = "${BLOCKSCOUT_API_KEY}", url = "https://exp.0xl3.com/api" }

[fuzz]
runs = 256

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options



fs_permissions = [{ access = "read-write", path = "./contract-addresses.json" }]
