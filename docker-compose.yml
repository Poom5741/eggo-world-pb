version: '3.8'

services:
  pocketbase:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: eggo-pb
    ports:
      - 8090:8090
    environment:
      - WALLET_SRV_URL=http://wallet-api:3001
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
    volumes:
      - ./apps/backend/pb_data:/pb/pb_data
      - ./apps/backend/pb_hooks:/pb/pb_hooks
      - ./apps/backend/pb_migrations:/pb/pb_migrations
      - ./apps/backend/pb_public:/pb/pb_public
    networks:
      - eggo-network
    depends_on:
      - wallet-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  wallet-api:
    build:
      context: ./wallet-api
      dockerfile: Dockerfile
    container_name: eggo-wallet-api
    ports:
      - 3001:3001
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - MIN_PASSWORD_LENGTH=12
      - MAX_PASSWORD_LENGTH=120
      - PUBLIC_ENCRYPTION=false
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - WALLET_MASTER_KEY=${WALLET_MASTER_KEY}
      - DACC_MNEMONIC=${DACC_MNEMONIC}
    networks:
      - eggo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: eggo-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/.next:/app/.next:ro
    depends_on:
      - pocketbase
    networks:
      - eggo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  eggo-network:
    driver: bridge
