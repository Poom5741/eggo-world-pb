# E2E Test Environment
# Phase 41: Framework Setup + Docker Environment
#
# Standalone isolated test environment (D-05: not extending docker-compose.yml)
# Usage: docker-compose -f docker-compose.e2e.yml up -d
#
# Services:
# - wallet-api: Gas sponsorship service
# - anvil: BSC testnet fork (D-09)
# - frontend: Static file server for apps/web/out/
#
# Note: PocketBase uses production instance (pb.eggoworld.io) for E2E testing
# due to local migration API compatibility issues with PocketBase 0.23.x
# Set POCKETBASE_URL environment variable to override

version: '3.8'

services:
  # Wallet API - Gas sponsorship service
  wallet-api:
    build:
      context: ./wallet-api
      dockerfile: Dockerfile
    container_name: e2e-wallet-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MIN_PASSWORD_LENGTH=12
      - MAX_PASSWORD_LENGTH=120
      - PUBLIC_ENCRYPTION=false
      - CORS_ORIGIN=*
      - WALLET_MASTER_KEY=${WALLET_MASTER_KEY:-e2e-test-key}
      # DACC mnemonic for gas sponsorship (use test mnemonic for E2E)
      - DACC_MNEMONIC=${DACC_MNEMONIC:-test test test test test test test test test test test junk}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-test@e2e.local}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-test-password}
      # E2E specific: Anvil RPC endpoint
      - RPC_URL=http://anvil:8545
      - EGG_NFT_ADDRESS=${EGG_NFT_ADDRESS:-0xb2FE193523A1E6A240141331A80755f5642e7A44}
    networks:
      - e2e-test-network
    restart: unless-stopped
    # D-08: Health check
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Anvil - Local test blockchain (D-09)
  # Changed from BSC testnet fork to local chain for full test control
  # Allows contract deployment and NFT minting for E2E tests
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: e2e-anvil
    ports:
      - "8545:8545"
    # Local chain (not forked) - enables contract deployment and minting
    environment:
      - ANVIL_IP_ADDR=0.0.0.0
      - ANVIL_PORT=8545
    entrypoint: ["anvil"]
    command: >-
      --host 0.0.0.0
      --port 8545
      --chain-id 7117
      --block-time 2
      --gas-limit 10000000000
    networks:
      - e2e-test-network
    restart: unless-stopped
    # D-08: Health check via JSON-RPC
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8545 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' | grep -q result || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Frontend - Static file server
  frontend:
    image: nginx:alpine
    container_name: e2e-frontend
    ports:
      - "3000:80"
    volumes:
      - ./apps/web/out:/usr/share/nginx/html:ro
    networks:
      - e2e-test-network
    restart: unless-stopped
    # D-08: Health check
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# D-06: Isolated network (not shared with dev compose)
networks:
  e2e-test-network:
    driver: bridge

# Named volumes for persistence (optional - can be removed for clean teardown)
