name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'wallet-api/**'
      - 'playwright.config.ts'
      - 'docker-compose.e2e.yml'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build frontend
        run: bun run build
        env:
          NEXT_PUBLIC_POCKETBASE_URL: https://pb.eggoworld.io

      - name: Start Docker services
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."
          TIMEOUT=60
          ELAPSED=0
          
          # Wait for wallet-api
          echo "Checking wallet-api health..."
          while ! curl -sf http://localhost:3001/health > /dev/null 2>&1; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for wallet-api"
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "wallet-api is healthy"
          
          # Wait for anvil
          echo "Checking anvil health..."
          ELAPSED=0
          while ! curl -sf -X POST http://localhost:8545 \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' | grep -q result; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for anvil"
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "anvil is healthy"
          
          # Wait for frontend (nginx serving static files)
          echo "Checking frontend health..."
          ELAPSED=0
          while ! curl -sf http://localhost:3000 > /dev/null 2>&1; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for frontend"
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "frontend is healthy"
          
          echo "All services are ready!"

      - name: Run E2E tests
        run: bun run test:e2e --workers=2 --retries=1
        env:
          CI: true
          PLAYWRIGHT_TIMEOUT: 60000
          E2E_BASE_URL: http://localhost:3000

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7