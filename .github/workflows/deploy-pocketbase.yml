name: Deploy PocketBase to Production

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-pocketbase.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/${{ fromJSON('"pocketbase"') }}
  PRODUCTION_HOST: ${{ secrets.DEPLOY_HOST }}
  DOCKER_COMPOSE_PATH: /opt/eggo-pocketbase

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Testing image: $IMAGE_TAG"
          # Start container in background and test health endpoint
          CONTAINER_ID=$(docker run -d --rm -p 8090:8090 "$IMAGE_TAG" serve --http=0.0.0.0:8090)
          sleep 5
          # Test health endpoint with curl from host
          curl --fail http://localhost:8090/api/health || {
            echo "Health check failed"
            docker kill $CONTAINER_ID
            exit 1
          }
          echo "Health check passed"
          docker kill $CONTAINER_ID

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add production host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to production server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ${{ env.DOCKER_COMPOSE_PATH }}
            
            # Pull latest image
            docker compose pull pocketbase
            
            # Dry-run migration check
            echo "Checking migrations..."
            docker compose run --rm pocketbase pocketbase migrate || {
              echo "Migration dry-run failed!"
              exit 1
            }
            
            # Stop current service
            docker compose down pocketbase
            
            # Start new version
            docker compose up -d pocketbase
            
            # Wait for service to be healthy
            echo "Waiting for service to be healthy..."
            sleep 10
            
            # Health check
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' eggo-pb)
            if [ "$HEALTH_STATUS" != "healthy" ]; then
              echo "Health check failed! Rolling back..."
              docker compose down pocketbase
              docker compose up -d pocketbase --force-recreate
              exit 1
            fi
            
            echo "Deployment successful!"
          EOF

      - name: Verify deployment
        run: |
          echo "Deployment completed. Commit SHA: ${{ github.sha }}"
          echo "Image tagged with: ${{ steps.meta.outputs.tags }}"
