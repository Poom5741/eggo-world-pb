name: PR Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'wallet-api/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install wallet-api dependencies
        run: |
          cd wallet-api
          bun install

      - name: Run wallet-api tests
        run: |
          cd wallet-api
          bun test
        env:
          WALLET_MASTER_KEY: test-key-for-ci-only
          DACC_MNEMONIC: test mnemonic for ci only

      - name: Validate Dockerfile syntax
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/backend/Dockerfile
          failure-threshold: warning

      - name: Validate docker-compose syntax
        run: |
          docker compose -f docker-compose.yml config --quiet
        env:
          LINE_CHANNEL_ID: test
          LINE_CHANNEL_SECRET: test
          WALLET_MASTER_KEY: test

      - name: Check YAML syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-check:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          load: true
          tags: pocketbase:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image health check
        run: |
          docker run --rm -d --name test-pocketbase -p 8090:8090 pocketbase:test
          sleep 5
          docker logs test-pocketbase
          docker exec test-pocketbase wget --spider http://localhost:8090/api/health || exit 1
          docker stop test-pocketbase
